<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カウンター操作パネル</title>
<style>
  :root { --bg: #1e1f26; --card: #2a2b34; --fg: #eee; --muted: #9a9aa8; --line: #3a3b46; --accent: #ff5fa2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "BIZ UDPGothic", "Meiryo", sans-serif; user-select: none; }
  main { padding: 10px; display: grid; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .val { font: 800 22px/1 Consolas, "BIZ UDPGothic", monospace; white-space: nowrap; }
  .val small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .btns { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  button { padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: #34353f; color: var(--fg); font: 700 15px inherit; font-family: inherit; cursor: pointer; }
  button:active { transform: translateY(1px); }
  button.plus { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 18px; }
  button.armed { background: #c0392b; border-color: #c0392b; color: #fff; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 2px; }
  .id { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<main id="list"></main>

<script>
(() => {
  const list = document.getElementById('list');
  const safe = (fn, d) => { try { return fn(); } catch (e) { return d; } };

  function counters() {
    const out = [];
    const n = safe(() => localStorage.length, 0);
    for (let i = 0; i < n; i++) {
      const k = safe(() => localStorage.key(i), '');
      if (!k || !k.startsWith('obs-counter-meta:')) continue;
      const id = k.slice('obs-counter-meta:'.length);
      if (id.startsWith('preview-')) continue;
      const meta = safe(() => JSON.parse(localStorage.getItem(k)), {}) || {};
      const v = parseInt(safe(() => localStorage.getItem('obs-counter:' + id), '0'), 10);
      out.push({ id, meta, value: Number.isFinite(v) ? v : 0 });
    }
    return out.sort((a, b) => a.id.localeCompare(b.id));
  }

  function send(id, action) {
    try { localStorage.setItem('obs-counter-cmd:' + id, JSON.stringify({ action, t: Date.now() + Math.random() })); } catch (e) {}
  }

  function render() {
    const items = counters();
    if (!items.length) {
      list.innerHTML = '<div class="empty">カウンターが見つかりません。<br>先にOBSでカウンターのブラウザソースを表示してください。</div>';
      return;
    }
    list.innerHTML = '';
    for (const c of items) {
      const el = document.createElement('div');
      el.className = 'item';
      el.dataset.id = c.id;
      const goal = c.meta.goal ? ` <small>/ ${c.meta.goal}</small>` : '';
      el.innerHTML = `<div class="top"><div class="name"></div><div class="val"><span class="v">${c.value}</span>${goal}</div></div>
        <div class="id"></div>
        <div class="btns"><button class="plus" data-a="inc">＋</button><button data-a="dec">－</button><button data-a="reset">リセット</button></div>`;
      el.querySelector('.name').textContent = c.meta.label || c.id;
      el.querySelector('.id').textContent = 'ID: ' + c.id;
      list.appendChild(el);
    }
  }

  list.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const id = b.closest('.item').dataset.id;
    if (b.dataset.a === 'reset') {
      // 誤操作防止：2回押しでリセット
      if (!b.classList.contains('armed')) {
        b.classList.add('armed'); b.textContent = 'もう一度';
        setTimeout(() => { b.classList.remove('armed'); b.textContent = 'リセット'; }, 2000);
        return;
      }
      b.classList.remove('armed'); b.textContent = 'リセット';
    }
    send(id, b.dataset.a);
  });

  addEventListener('storage', (e) => {
    if (!e.key) return render();
    if (e.key.startsWith('obs-counter-meta:')) return render();
    if (e.key.startsWith('obs-counter:')) {
      const id = e.key.slice('obs-counter:'.length);
      const v = list.querySelector(`.item[data-id="${CSS.escape(id)}"] .v`);
      if (v) v.textContent = e.newValue; else render();
    }
  });
  // 数値の取りこぼし対策
  setInterval(() => {
    for (const c of counters()) {
      const v = list.querySelector(`.item[data-id="${CSS.escape(c.id)}"] .v`);
      if (!v) return render();
      if (v.textContent !== String(c.value)) v.textContent = c.value;
    }
  }, 1000);
  render();
})();
</script>
</body>
</html>
