<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>段位ポイント 操作パネル</title>
<style>
  :root { --bg: #1e1f26; --card: #2a2b34; --fg: #eee; --muted: #9a9aa8; --line: #3a3b46; --gold: #d4a017; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "BIZ UDPGothic", "Meiryo", sans-serif; }
  main { padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  select, input { width: 100%; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: #1a1b22; color: var(--fg); font: inherit; }
  input.score { font: 800 22px Consolas, monospace; text-align: right; }
  button { padding: 7px 6px; border-radius: 8px; border: 1px solid var(--line); background: #34353f; color: var(--fg); font: 700 14px inherit; font-family: inherit; cursor: pointer; }
  button:active { transform: translateY(1px); }
  .places { display: grid; gap: 6px; }
  .places button { padding: 10px 0 8px; font-size: 18px; border: 0; color: #fff; background: #3d4f8a; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
  .places button:first-child { background: #b8860b; }
  .places button:last-child { background: #8a3d4f; }
  .places button small { font-size: 12px; opacity: .9; font-weight: 400; }
  button.armed { background: #c0392b !important; border-color: #c0392b; color: #fff; }
  .muted { color: var(--muted); font-size: 12px; }
  .stat { font-weight: 800; font-size: 16px; }
  .tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="stat" id="status">-</div>
    <div class="muted" id="mode"></div>
  </div>

  <div class="card">
    <div class="muted">終局時の持ち点</div>
    <input class="score" id="score" type="number" step="100" placeholder="例 32400">
    <div class="places" id="places" style="margin-top:8px"></div>
    <div class="muted" style="margin-top:4px">点数を入れてから着順を押してください（空欄なら原点として計算）</div>
  </div>

  <div class="tools">
    <button id="undo">1つ取り消し</button>
    <button id="newday" data-label="新しい日">新しい日</button>
    <button id="toggle">設定</button>
  </div>

  <div class="card" id="settings" hidden>
    <div class="grid2">
      <div><div class="muted">人数</div><select id="players"><option value="4">四麻</option></select></div>
      <div><div class="muted">長さ</div><select id="length"><option value="hanchan">半荘</option><option value="tonpu">東風</option></select></div>
    </div>
    <div class="muted" style="margin-top:6px">卓</div>
    <select id="table">
      <option value="bronze">銅の間</option><option value="silver">銀の間</option><option value="gold">金の間</option>
      <option value="jade">玉の間</option><option value="throne">王座の間</option>
    </select>
    <div class="grid2" style="margin-top:6px">
      <div><div class="muted">現在の段位</div><select id="rank"></select></div>
      <div><div class="muted">現在のpt</div><input id="pt" type="number" step="1"></div>
    </div>
    <div class="row" style="margin-top:8px"><button id="save" style="flex:1">この内容で合わせる</button></div>
    <div class="muted" style="margin-top:6px">ゲーム内の段位とptに合わせてから使い始めてください。ずれたときもここで直せます。</div>
    <div class="muted" style="margin-top:6px">記録ID：<input id="cid" value="mj1" style="width:90px;display:inline-block;padding:2px 6px"></div>
  </div>
</main>

<script src="rules.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const safe = (fn, d) => { try { return fn(); } catch (e) { return d; } };
  const keyOf = () => 'mj-counter:' + ($('cid').value || 'mj1');
  const blank = () => ({ v: 1, players: 4, length: 'hanchan', table: 'silver', rank: 3, pt: 300, games: [], sessionStart: Date.now() });
  const load = () => {
    const d = safe(() => JSON.parse(localStorage.getItem(keyOf())), null) || blank();
    
    d.players = 4; // 無償版は四麻のみ
    
    return d;
  };
  const save = (d) => safe(() => localStorage.setItem(keyOf(), JSON.stringify(d)));
  const sign = (n) => (n > 0 ? '+' + n : String(n));

  MJ.RANK_NAMES.forEach((n, i) => { const o = document.createElement('option'); o.value = i; o.textContent = n; $('rank').appendChild(o); });

  function score(d) {
    const v = $('score').value.trim();
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? n : (d.players === 3 ? 35000 : 25000);
  }

  function render() {
    const d = load();
    $('status').textContent = `${MJ.RANK_NAMES[d.rank]}　${d.pt} / ${MJ.MAX_POINTS[d.rank]}`;
    const today = d.games.filter((g) => g.t >= d.sessionStart);
    const sum = today.reduce((s, g) => s + g.d, 0);
    $('mode').textContent = `${d.players === 3 ? '三麻' : '四麻'}・${MJ.TABLE_NAMES[d.table]}・${d.length === 'tonpu' ? '東風' : '半荘'}　今日 ${today.length}戦 ${sign(sum)}pt`;
    // 着順ボタン（押した場合の増減を表示）
    const box = $('places');
    box.style.gridTemplateColumns = `repeat(${d.players}, minmax(0, 1fr))`;
    box.innerHTML = '';
    const s = score(d);
    for (let p = 1; p <= d.players; p++) {
      const delta = MJ.delta({ players: d.players, length: d.length, table: d.table, rank: d.rank, place: p, score: s });
      const b = document.createElement('button');
      b.dataset.place = p;
      b.innerHTML = `${p}着<small>${sign(delta)}</small>`;
      box.appendChild(b);
    }
    // 設定欄
    $('players').value = d.players; $('length').value = d.length; $('table').value = d.table;
    $('rank').value = d.rank; if (document.activeElement !== $('pt')) $('pt').value = d.pt;
  }

  $('places').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const d = load();
    const place = +b.dataset.place;
    const s = score(d);
    const delta = MJ.delta({ players: d.players, length: d.length, table: d.table, rank: d.rank, place, score: s });
    const next = MJ.apply({ rank: d.rank, pt: d.pt }, delta);
    d.games.push({ t: Date.now(), place, score: s, d: delta, rankBefore: d.rank, ptBefore: d.pt, event: next.event });
    if (d.games.length > 3000) d.games.shift();
    d.rank = next.rank; d.pt = next.pt;
    save(d);
    $('score').value = '';
    render();
  });
  $('score').addEventListener('input', render);

  $('undo').onclick = () => {
    const d = load(); const g = d.games.pop(); if (!g) return;
    d.rank = g.rankBefore; d.pt = g.ptBefore; save(d); render();
  };
  // 誤操作防止の2回押し
  $('newday').onclick = function () {
    if (!this.classList.contains('armed')) {
      this.classList.add('armed'); this.textContent = 'もう一度';
      setTimeout(() => { this.classList.remove('armed'); this.textContent = this.dataset.label; }, 2000);
      return;
    }
    this.classList.remove('armed'); this.textContent = this.dataset.label;
    const d = load(); d.sessionStart = Date.now(); save(d); render();
  };
  $('toggle').onclick = () => { $('settings').hidden = !$('settings').hidden; };
  $('save').onclick = () => {
    const d = load();
    d.players = +$('players').value; d.length = $('length').value; d.table = $('table').value;
    d.rank = +$('rank').value;
    const pt = parseInt($('pt').value, 10);
    d.pt = Number.isFinite(pt) ? Math.max(0, pt) : MJ.startingPoint(d.rank);
    save(d); render();
  };
  // 人数・長さ・卓は選んだ時点で反映（段位とptは「合わせる」ボタンで反映）
  ['players', 'length', 'table'].forEach((id) => $(id).addEventListener('change', () => {
    const d = load(); d.players = +$('players').value; d.length = $('length').value; d.table = $('table').value; save(d); render();
  }));
  $('cid').addEventListener('change', render);
  addEventListener('storage', (e) => { if (e.key === keyOf()) render(); });

  if (!safe(() => localStorage.getItem(keyOf()), null)) { save(blank()); $('settings').hidden = false; }
  render();
})();
</script>
</body>
</html>
